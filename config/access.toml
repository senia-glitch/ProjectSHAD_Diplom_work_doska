# Единая политика доступа: роль -> внешние сценарии.
# Доска открыта по ссылке: анонимный участник получает роль guest.
# Знание неугадываемого идентификатора доски в ссылке и есть право доступа к ней.

[roles.guest]
scenarios = [
  "boards.create",
  "boards.view",
  "boards.collaborate",
  "service.health",
  "service.ready",
]
