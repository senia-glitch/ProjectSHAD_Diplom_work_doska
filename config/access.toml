# Единая политика доступа: роль -> внешние сценарии.
# Учётных записей нет: любой посетитель получает роль guest.
# Право войти на конкретную доску даёт пара «ссылка + код», её проверяет boards.join.

[roles.guest]
scenarios = [
  "boards.create",
  "boards.join",
  "boards.import",
  "service.health",
  "service.ready",
]
