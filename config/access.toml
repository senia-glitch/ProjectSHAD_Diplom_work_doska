# Единая политика доступа: роль -> внешние сценарии.
# Учётных записей нет: любой посетитель получает роль guest.
# Право войти на доску даёт её код (или прежний вход с этого устройства); проверяет boards.join.
# Права создателя доски (смена кода, исключение участников) проверяются внутри доски.

[roles.guest]
scenarios = [
  "boards.create",
  "boards.join",
  "boards.import",
  "service.health",
  "service.ready",
]
