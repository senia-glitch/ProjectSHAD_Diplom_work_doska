# Пример nginx для сервера. Замените board.example.com на свой домен,
# сертификат получите, например, через certbot (Let's Encrypt).
# Страница по https:// автоматически подключается к WebSocket по wss://.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Ключ шарда: идентификатор доски из адреса. Все запросы одной доски (страница, WebSocket,
# загрузка файла) уходят в один процесс приложения; остальные запросы — по адресу клиента.
map $uri $doska_shard_key {
    ~^/b/(?<shard_board>[A-Za-z0-9_-]+)                $shard_board;
    ~^/api/v1/boards/(?<shard_api_board>[A-Za-z0-9_-]+)/  $shard_api_board;
    default                                            $remote_addr;
}

# Процессы приложения (compose.prod.yaml: app → APP_PORT, app-2 → APP_PORT_2).
# consistent: при добавлении процесса переезжает лишь часть досок.
upstream doska_app {
    hash $doska_shard_key consistent;
    server 127.0.0.1:18090 max_fails=0;
    server 127.0.0.1:18091 max_fails=0;
}

# Дополнительная защита от массового создания досок и спама входами (приложение тоже ограничивает).
limit_req_zone $binary_remote_addr zone=doska_create:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=doska_join:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name board.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name board.example.com;

    ssl_certificate     /etc/letsencrypt/live/board.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/board.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;

    location = /api/v1/boards {
        limit_req zone=doska_create burst=10 nodelay;
        proxy_pass http://doska_app;
        include /etc/nginx/doska-proxy.conf;
    }

    # Вход на доску (WebSocket): ограничение частоты подключений с одного адреса.
    location ~ ^/api/v1/boards/[A-Za-z0-9_-]+/ws$ {
        limit_req zone=doska_join burst=20 nodelay;
        proxy_pass http://doska_app;
        include /etc/nginx/doska-proxy.conf;
    }

    # Загрузка файла доски: до 16 МБ (BOARD_MAX_IMPORT_BYTES), только этот адрес.
    location ~ ^/api/v1/boards/[A-Za-z0-9_-]+/import$ {
        client_max_body_size 16m;
        proxy_request_buffering on;
        proxy_pass http://doska_app;
        include /etc/nginx/doska-proxy.conf;
    }

    location / {
        proxy_pass http://doska_app;
        include /etc/nginx/doska-proxy.conf;
    }
}

# Отдельный файл /etc/nginx/doska-proxy.conf:
#   proxy_http_version 1.1;
#   proxy_set_header Host $http_host;   # с портом: по нему сверяется Origin WebSocket
#   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header Upgrade $http_upgrade;          # WebSocket
#   proxy_set_header Connection $connection_upgrade;  # WebSocket
#   proxy_read_timeout 120s;   # клиент шлёт ping каждые 25 с
#   proxy_send_timeout 120s;
#   proxy_buffering off;
#   proxy_next_upstream off;   # не переносить запрос доски в другой процесс
