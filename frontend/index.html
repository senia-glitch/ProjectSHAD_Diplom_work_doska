<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доска — совместное рисование</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/"><img class="brand-logo" src="/favicon.svg" width="28" height="28" alt=""><span class="brand-name">Доска</span></a>
      <div class="header-actions" id="header-actions"></div>
    </div>
  </header>
  <main id="main" class="wrap" tabindex="-1">
    <div class="page-head">
      <h1>Совместная доска</h1>
      <p class="lead">Создайте доску и отправьте ссылку: все, у кого она есть, рисуют вместе в реальном времени.</p>
    </div>
    <div class="home-grid">
      <section class="form-card" aria-labelledby="new-title">
        <h2 id="new-title">Новая доска</h2>
        <form id="create-form" novalidate>
          <label>Название <span class="hint">необязательно</span>
            <input type="text" id="title" name="title" maxlength="120" autocomplete="off" placeholder="Например, План спринта">
          </label>
          <p class="error-text" id="create-error" hidden></p>
          <div class="row"><button class="btn primary" id="create-btn" type="submit">Создать доску</button></div>
        </form>
      </section>
      <section class="form-card" aria-labelledby="join-title">
        <h2 id="join-title">Открыть по ссылке</h2>
        <form id="join-form" novalidate>
          <label>Ссылка на доску
            <input type="text" id="join-link" name="link" autocomplete="off" placeholder="http://…/b/…">
          </label>
          <p class="error-text" id="join-error" hidden></p>
          <div class="row"><button class="btn" type="submit">Открыть</button></div>
        </form>
      </section>
    </div>
    <section class="recent" aria-labelledby="recent-title" id="recent" hidden>
      <h2 id="recent-title">Недавние доски</h2>
      <div class="list" id="recent-list"></div>
    </section>
  </main>
  <script src="/common.js"></script>
  <script src="/index.js"></script>
</body>
</html>
